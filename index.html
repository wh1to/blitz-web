            <script>
                const GITHUB_JSON_URL = 'https://raw.githubusercontent.com/wh1to/ProjectBlitzOpenReQ/refs/heads/main/news-config.json';

                async function loadNewsFromGitHub() {
                    try {
                        const response = await fetch(GITHUB_JSON_URL);
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const config = await response.json();
                        renderMainGrid(config.mainGrid);
                        renderNewsList(config.newsList);
                        initTimers();
                    } catch (error) {
                        loadNewsFromGitHub();
                    }
                }

                function renderMainGrid(config) {
                    const container = document.getElementById('news-grid-container');
                    if (!container) return;

                    container.innerHTML = '';
                    container.className = `b4r-grid b4r-grid__type-${config.gridType || 2}`;

                    const sortedItems = [...config.items].sort((a, b) => a.position - b.position);

                    sortedItems.forEach(item => {
                        const gridItem = document.createElement('div');
                        gridItem.className = `b4r-grid_item b4r-grid_item__${item.position}`;
                        gridItem.id = `grid-item-${item.id}`;
                        gridItem.innerHTML = generateMainGridItemHTML(item);
                        container.appendChild(gridItem);
                    });
                }

                function renderNewsList(config) {
                    const container = document.getElementById('news-list-container');
                    if (!container) return;

                    const maxItems = config.maxItems || 5;
                    const itemsToShow = config.items.slice(0, maxItems);

                    let newsItemsHTML = '';
                    itemsToShow.forEach(item => {
                        newsItemsHTML += generateNewsListItemHTML(item);
                    });

                    container.innerHTML = `
                                    <h2 class="news-list_heading">
                                        <span>${config.title || 'Последние записи'}</span>
                                    </h2>
                                    <div>
                                        ${newsItemsHTML}
                                        <div class="section-more news-list_section-more">
                                            <a href="${config.viewAllLink || '/ru/news/'}" class="button-more">
                                                <span>${config.viewAllText || 'Все записи'}</span>
                                            </a>
                                        </div>
                                    </div>
                                `;
                }

                function generateMainGridItemHTML(item) {
                    const categoryHTML = item.category ? `
                                    <div class="news-info news-b4r_news-info">
                                        <a href="${item.category.link}" class="news-info_tag">
                                            <span class="news-info_tag-text">${item.category.name}</span>
                                            <span class="news-info_tag-text">${item.category.name}</span>
                                        </a>
                                        ${item.showTimer ? `
                                        <span class="timer-container" data-timer-type="main" data-timer-end="${item.timerEnd}">
                                            <span class="timer-days"></span> д
                                            <span class="timer-hours"></span> ч
                                            <span class="timer-minutes"></span> мин
                                        </span>` : ''}
                                    </div>
                                ` : '';

                    return `
                                    <div class="news-b4r b4r-grid_news-b4r">
                                        <div class="news-b4r_img" style="background-image: url('${item.image}');"></div>
                                        <div class="news-b4r_content">
                                            <h3 class="news-b4r_heading">${item.title}</h3>
                                            <p class="news-b4r_description">${item.description}</p>
                                            ${categoryHTML}
                                        </div>
                                        <a href="${item.link}" target="${item.target || '_self'}" class="news-b4r_link"></a>
                                    </div>
                                `;
                }

                function generateNewsListItemHTML(item) {
                    const timerHTML = item.showTimer ? `
                                    <span class="timer-container" data-timer-type="list" data-timer-end="${item.timerEnd}">
                                        <span class="timer-days"></span> д
                                        <span class="timer-hours"></span> ч
                                        <span class="timer-minutes"></span> мин
                                    </span>
                                ` : '<span></span>';

                    return `
                                    <div class="news-list_item">
                                        <div class="news-annotation">
                                            <div class="news-annotation_img" style="background-image: url('${item.image}');"></div>
                                            <div class="news-annotation_content">
                                                <div class="news-annotation_header">
                                                    <span class="news-annotation_heading">${item.title}</span>
                                                    <span class="news-annotation_text">${item.description}</span>
                                                </div>
                                                <div class="news-info news-annotation_news-info">
                                                    <a href="${item.category?.link || '#'}" class="news-info_tag">
                                                        <span class="news-info_tag-text">${item.category?.name || ''}</span>
                                                        <span class="news-info_tag-text">${item.category?.name || ''}</span>
                                                    </a>
                                                    ${timerHTML}
                                                </div>
                                            </div>
                                            <a href="${item.link}" class="news-annotation_link"></a>
                                        </div>
                                    </div>
                                `;
                }

                function initTimers() {
                    const timerContainers = document.querySelectorAll('.timer-container[data-timer-end]');

                    timerContainers.forEach(container => {
                        const endTime = new Date(container.getAttribute('data-timer-end')).getTime();
                        updateTimer(container, endTime);
                        const timerInterval = setInterval(() => updateTimer(container, endTime), 1000);
                        container.dataset.intervalId = timerInterval;
                    });
                }

                function updateTimer(container, endTime) {
                    const now = new Date().getTime();
                    const timeRemaining = endTime - now;

                    if (timeRemaining > 0) {
                        const days = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
                        container.innerHTML = `${days} д ${hours} ч ${minutes} мин`;
                    } else {
                        container.innerHTML = 'Событие завершено';
                        container.style.color = '#999';
                        if (container.dataset.intervalId) clearInterval(parseInt(container.dataset.intervalId));
                    }
                }

                document.addEventListener('DOMContentLoaded', loadNewsFromGitHub);
            </script>
